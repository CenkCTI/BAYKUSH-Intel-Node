name: baykush-intel-node

x-node-image: &node-image
  image: ${BAYKUSH_NODE_IMAGE:?BAYKUSH_NODE_IMAGE must be an immutable release tag or digest}
  pull_policy: always
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: ${NODE_DEFAULT_PIDS_LIMIT:-128}
  mem_limit: ${NODE_DEFAULT_MEM_LIMIT:-384m}
  cpus: ${NODE_DEFAULT_CPUS:-0.50}
  stop_grace_period: 30s
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  networks:
    - backend
  group_add:
    - "${BAYKUSH_SECRET_GID:-2000}"
  volumes:
    - ${BAYKUSH_SECRET_DIR:?BAYKUSH_SECRET_DIR is required}:/run/secrets/baykush:ro
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-node-env: &node-env
  ENABLE_TEST_SYNTHETIC: "false"
  WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-5}
  WORKER_RETRY_MAX_SECONDS: ${WORKER_RETRY_MAX_SECONDS:-300}
  SOURCE_HTTP_TIMEOUT_MS: ${SOURCE_HTTP_TIMEOUT_MS:-30000}
  GLOBAL_MAX_RAW_RECORD_BYTES: ${GLOBAL_MAX_RAW_RECORD_BYTES:-8388608}
  HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-10000}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 96
    mem_limit: ${CADDY_MEM_LIMIT:-192m}
    cpus: ${CADDY_CPUS:-0.25}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    environment:
      NODE_HOSTNAME: ${NODE_HOSTNAME:?NODE_HOSTNAME is required}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    init: true
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    cpus: ${POSTGRES_CPUS:-1.50}
    stop_grace_period: 60s
    group_add:
      - "${BAYKUSH_SECRET_GID:-2000}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baykush}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/baykush/postgres_password
    volumes:
      - baykush_pgdata:/var/lib/postgresql/data
      - ${BAYKUSH_SECRET_DIR}:/run/secrets/baykush:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-baykush}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  migrate:
    <<: *node-image
    restart: "no"
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    cpus: ${MIGRATE_CPUS:-0.75}
    command: ["/bin/sh", "scripts/runtime-with-secrets.sh", "node", "scripts/migrate.mjs"]
    environment:
      <<: *node-env
      DATABASE_URL_FILE: /run/secrets/baykush/db_migrator_url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *node-image
    mem_limit: ${API_MEM_LIMIT:-512m}
    cpus: ${API_CPUS:-0.75}
    command: ["/bin/sh", "scripts/runtime-with-secrets.sh", "node", "dist/api/main.js"]
    environment:
      <<: *node-env
      DATABASE_URL_FILE: /run/secrets/baykush/db_api_url
      PORT: "8080"
      NODE_INSTANCE_ID: api-1
      BAYKUSH_NODE_API_CREDENTIALS_FILE: /run/secrets/baykush/api_credentials.json
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_STANDARD: ${API_RATE_LIMIT_STANDARD:-120}
      API_RATE_LIMIT_EXPENSIVE: ${API_RATE_LIMIT_EXPENSIVE:-30}
    expose:
      - "8080"
    networks:
      - edge
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  scheduler:
    <<: *node-image
    command: ["/bin/sh", "scripts/runtime-with-secrets.sh", "node", "dist/scheduler/main.js"]
    environment:
      <<: *node-env
      DATABASE_URL_FILE: /run/secrets/baykush/db_ingest_url
      NODE_INSTANCE_ID: scheduler-1
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *node-image
    mem_limit: ${WORKER_MEM_LIMIT:-768m}
    cpus: ${WORKER_CPUS:-1.00}
    command: ["/bin/sh", "scripts/runtime-with-secrets.sh", "node", "dist/worker/node5-main.js"]
    environment:
      <<: *node-env
      DATABASE_URL_FILE: /run/secrets/baykush/db_ingest_url
      NODE_INSTANCE_ID: worker-1
      NVD_API_KEY_FILE: ${NVD_API_KEY_FILE:-}
      THREATFOX_AUTH_KEY_FILE: ${THREATFOX_AUTH_KEY_FILE:-}
      MALWAREBAZAAR_AUTH_KEY_FILE: ${MALWAREBAZAAR_AUTH_KEY_FILE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backfill:
    <<: *node-image
    mem_limit: ${BACKFILL_MEM_LIMIT:-768m}
    cpus: ${BACKFILL_CPUS:-0.75}
    command: ["/bin/sh", "scripts/runtime-with-secrets.sh", "node", "dist/backfill/main.js"]
    environment:
      <<: *node-env
      DATABASE_URL_FILE: /run/secrets/baykush/db_ingest_url
      NODE_INSTANCE_ID: backfill-1
      NVD_API_KEY_FILE: ${NVD_API_KEY_FILE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  normalizer:
    <<: *node-image
    mem_limit: ${NORMALIZER_MEM_LIMIT:-768m}
    cpus: ${NORMALIZER_CPUS:-0.75}
    command: ["/bin/sh", "scripts/runtime-with-secrets.sh", "node", "dist/normalizer/main.js"]
    environment:
      <<: *node-env
      DATABASE_URL_FILE: /run/secrets/baykush/db_ingest_url
      NODE_INSTANCE_ID: normalizer-1
    depends_on:
      migrate:
        condition: service_completed_successfully

  measurement:
    <<: *node-image
    mem_limit: ${MEASUREMENT_MEM_LIMIT:-768m}
    cpus: ${MEASUREMENT_CPUS:-0.75}
    command: ["/bin/sh", "scripts/runtime-with-secrets.sh", "node", "dist/measurement/main.js"]
    environment:
      <<: *node-env
      DATABASE_URL_FILE: /run/secrets/baykush/db_projection_url
      NODE_INSTANCE_ID: measurement-1
    depends_on:
      migrate:
        condition: service_completed_successfully

  discovery:
    <<: *node-image
    mem_limit: ${DISCOVERY_MEM_LIMIT:-768m}
    cpus: ${DISCOVERY_CPUS:-0.75}
    command: ["/bin/sh", "scripts/runtime-with-secrets.sh", "node", "dist/discovery/worker/main.js"]
    environment:
      <<: *node-env
      DATABASE_URL_FILE: /run/secrets/baykush/db_projection_url
      NODE_INSTANCE_ID: discovery-1
      IPINFO_LITE_TOKEN_FILE: ${IPINFO_LITE_TOKEN_FILE:-}
      NODE7_GEO_HTTP_TIMEOUT_MS: ${NODE7_GEO_HTTP_TIMEOUT_MS:-8000}
      NODE7_GEO_REFRESH_HOURS: ${NODE7_GEO_REFRESH_HOURS:-24}
    depends_on:
      migrate:
        condition: service_completed_successfully

  stream-worker:
    <<: *node-image
    mem_limit: ${STREAM_MEM_LIMIT:-1g}
    cpus: ${STREAM_CPUS:-1.00}
    pids_limit: ${STREAM_PIDS_LIMIT:-192}
    command: ["/bin/sh", "scripts/runtime-with-secrets.sh", "node", "dist/stream/main.js"]
    environment:
      <<: *node-env
      DATABASE_URL_FILE: /run/secrets/baykush/db_stream_url
      NODE_INSTANCE_ID: stream-worker-1
      STREAM_RAW_RETENTION_HOURS: ${STREAM_RAW_RETENTION_HOURS:-48}
      STREAM_QUEUE_MAX_MESSAGES: ${STREAM_QUEUE_MAX_MESSAGES:-50000}
      STREAM_QUEUE_MAX_BYTES: ${STREAM_QUEUE_MAX_BYTES:-67108864}
      STREAM_SEGMENT_MAX_MESSAGES: ${STREAM_SEGMENT_MAX_MESSAGES:-5000}
      STREAM_SEGMENT_MAX_BYTES: ${STREAM_SEGMENT_MAX_BYTES:-4194304}
    depends_on:
      migrate:
        condition: service_completed_successfully

  recovery-worker:
    <<: *node-image
    mem_limit: ${RECOVERY_MEM_LIMIT:-1g}
    cpus: ${RECOVERY_CPUS:-1.00}
    pids_limit: ${RECOVERY_PIDS_LIMIT:-192}
    command: ["/bin/sh", "scripts/runtime-with-secrets.sh", "node", "dist/recovery/main.js"]
    environment:
      <<: *node-env
      DATABASE_URL_FILE: /run/secrets/baykush/db_recovery_url
      NODE_INSTANCE_ID: recovery-worker-1
      RECOVERY_AUTO_ENABLED: ${RECOVERY_AUTO_ENABLED:-false}
      RECOVERY_STAGING_DIR: /var/lib/baykush/recovery
      RECOVERY_DECODER_PATH: /usr/local/bin/baykush-mrt-decoder
      RECOVERY_MAX_ATTEMPTS: ${RECOVERY_MAX_ATTEMPTS:-4}
      RECOVERY_ARCHIVE_SETTLE_SECONDS: ${RECOVERY_ARCHIVE_SETTLE_SECONDS:-900}
      RECOVERY_MAX_ARTIFACT_BYTES: ${RECOVERY_MAX_ARTIFACT_BYTES:-536870912}
      RECOVERY_MIN_FREE_DISK_BYTES: ${RECOVERY_MIN_FREE_DISK_BYTES:-1073741824}
      RECOVERY_ARTIFACT_RETENTION_HOURS: ${RECOVERY_ARTIFACT_RETENTION_HOURS:-24}
      RECOVERY_DECODER_TIMEOUT_MS: ${RECOVERY_DECODER_TIMEOUT_MS:-300000}
      RECOVERY_DECODER_MAX_OUTPUT_BYTES: ${RECOVERY_DECODER_MAX_OUTPUT_BYTES:-1073741824}
      RECOVERY_DECODER_MAX_RECORDS: ${RECOVERY_DECODER_MAX_RECORDS:-10000000}
      RECOVERY_PAUSE_ON_STREAM_UNHEALTHY: ${RECOVERY_PAUSE_ON_STREAM_UNHEALTHY:-true}
    volumes:
      - ${BAYKUSH_SECRET_DIR}:/run/secrets/baykush:ro
      - baykush_recovery:/var/lib/baykush/recovery
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  edge:
    name: baykush-edge
  backend:
    name: baykush-backend
    internal: true

volumes:
  baykush_pgdata:
  baykush_recovery:
  caddy_data:
  caddy_config:
