name: NODE-6.2 lock bootstrap

on:
  push:
    branches:
      - agent/node6-2-mrt-recovery

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_RETRY: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/node6-2-mrt-recovery
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Generate decoder lockfile
        run: cargo +1.88.0 generate-lockfile --manifest-path decoder/baykush-mrt-decoder/Cargo.toml
      - name: Commit lockfile once
        shell: bash
        run: |
          if git diff --quiet -- decoder/baykush-mrt-decoder/Cargo.lock; then
            echo "Cargo.lock already matches Cargo.toml"
            exit 0
          fi
          git config user.name "baykush-node-ci"
          git config user.email "baykush-node-ci@users.noreply.github.com"
          git add decoder/baykush-mrt-decoder/Cargo.lock
          git commit -m "Pin NODE-6.2 decoder Cargo dependency graph"
          git push origin HEAD:agent/node6-2-mrt-recovery
