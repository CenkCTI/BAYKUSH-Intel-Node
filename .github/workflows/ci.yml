name: NODE validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: baykush
          POSTGRES_USER: baykush
          POSTGRES_PASSWORD: baykush
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baykush -d baykush"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://baykush:baykush@127.0.0.1:5432/baykush
      ENABLE_TEST_SYNTHETIC: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: NODE-6.2 populated upgrade-path acceptance
        run: npm run test:node6-2-upgrade
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify migration immutability and idempotency
        run: |
          npm run db:migrate
          npm run test:migration
          npm run test:node4-backfill
      - name: NODE-5A source admission acceptance
        run: npm run test:node5a
      - name: Runtime acceptance
        run: npm run test:runtime
      - name: NODE-2A production foundation acceptance
        run: npm run test:node2a
      - name: NODE-2B CISA KEV acceptance
        run: npm run test:node2b
      - name: NODE-2C NVD CVE acceptance
        run: npm run test:node2c
      - name: NODE-2D FIRST EPSS acceptance
        run: npm run test:node2d
      - name: NODE-2E ThreatFox acceptance
        run: npm run test:node2e
      - name: NODE-2F MalwareBazaar acceptance
        run: npm run test:node2f
      - name: NODE-2G five-source aggregate acceptance
        run: npm run test:node2g
      - name: NODE-2G deterministic resilience acceptance
        run: npm run test:node2g-resilience
      - name: NODE-2G final database invariant audit
        run: npm run node2g:final-audit
      - name: NODE-2G security and private-boundary audit
        run: npm run node2g:security-audit
      - name: NODE-3 PostgreSQL measurement acceptance
        env:
          NODE3_ACCEPTANCE_CONFIRMED: "true"
        run: npm run test:node3
      - name: NODE-3 final database invariant audit
        run: npm run node3:final-audit
      - name: NODE-3 measurement security audit
        run: npm run node3:security-audit
      - name: NODE-6.2 semantic unit acceptance
        run: npm run test:node6-2
      - name: NODE-6.2 PostgreSQL recovery acceptance
        env:
          NODE6_2_ACCEPTANCE_CONFIRMED: "true"
        run: npm run test:node6-2-db
      - name: NODE-6.2 final database invariant audit
        run: npm run node6-2:final-audit
      - name: NODE-6.2 security boundary audit
        run: npm run node6-2:security-audit
      - name: NODE-7 PostgreSQL discovery acceptance
        run: npm run test:node7
      - name: Validate NODE-3 compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.node3.yml config >/dev/null
      - name: Validate NODE-6.2 recovery compose service
        run: docker compose config >/dev/null
      - name: Validate NODE-7 discovery compose service
        run: |
          docker compose config --services | grep -qx discovery
          docker compose config | grep -q 'dist/discovery/worker/main.js'
      - name: NODE-8 production deployment and secret-boundary acceptance
        env:
          BAYKUSH_NODE_IMAGE: ghcr.io/cenkcti/baykush-intel-node@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          NODE_HOSTNAME: node.example.com
          ACME_EMAIL: ops@example.com
          BAYKUSH_SECRET_DIR: /tmp/baykush-ci-secrets
          POSTGRES_DB: baykush
          POSTGRES_USER: baykush
          NVD_API_KEY_FILE: /run/secrets/baykush/nvd_api_key
          API_RATE_LIMIT_WINDOW_MS: "60000"
          API_RATE_LIMIT_STANDARD: "120"
          API_RATE_LIMIT_EXPENSIVE: "30"
        run: |
          bash -n deploy/production/scripts/preflight.sh
          bash -n deploy/production/scripts/deploy.sh
          bash -n deploy/production/scripts/smoke-test.sh
          sh -n scripts/runtime-with-secrets.sh
          docker compose -f deploy/production/compose.yml config --format json > /tmp/node8-compose.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/node8-compose.json', 'utf8'));
          const expected = ['caddy','postgres','migrate','api','scheduler','worker','backfill','normalizer','measurement','discovery','stream-worker','recovery-worker'];
          for (const service of expected) {
            if (!config.services?.[service]) throw new Error(`missing production service ${service}`);
          }
          if (!config.networks?.backend?.internal) throw new Error('backend network must be internal');
          if (config.services.postgres.ports?.length) throw new Error('PostgreSQL must not publish a host port');
          if (config.services.api.ports?.length) throw new Error('API must not publish a host port');
          const published = (config.services.caddy.ports ?? []).map((p) => Number(p.published)).sort((a,b)=>a-b);
          if (!published.includes(80) || !published.includes(443)) throw new Error(`Caddy must publish 80/443: ${published}`);
          const publicServices = Object.entries(config.services)
            .filter(([, svc]) => (svc.ports ?? []).length > 0)
            .map(([name]) => name);
          if (publicServices.length !== 1 || publicServices[0] !== 'caddy') {
            throw new Error(`only Caddy may publish host ports: ${publicServices}`);
          }
          if ((config.services.api.networks ?? {}).edge === undefined) throw new Error('API must join edge network');
          if ((config.services.postgres.networks ?? {}).edge !== undefined) throw new Error('PostgreSQL must not join edge network');

          const apiEnv = config.services.api.environment ?? {};
          if (apiEnv.DATABASE_URL !== undefined) throw new Error('API must not receive raw DATABASE_URL in production Compose');
          if (apiEnv.BAYKUSH_NODE_API_TOKEN !== undefined) throw new Error('API must not receive raw bearer token in production Compose');
          if (apiEnv.DATABASE_URL_FILE !== '/run/secrets/baykush/database_url') throw new Error('API database secret-file contract missing');
          if (apiEnv.BAYKUSH_NODE_API_CREDENTIALS_FILE !== '/run/secrets/baykush/api_credentials.json') throw new Error('API credential registry file contract missing');
          const pgEnv = config.services.postgres.environment ?? {};
          if (pgEnv.POSTGRES_PASSWORD !== undefined) throw new Error('PostgreSQL raw password must not be present');
          if (pgEnv.POSTGRES_PASSWORD_FILE !== '/run/secrets/baykush/postgres_password') throw new Error('PostgreSQL password file missing');
          const workerEnv = config.services.worker.environment ?? {};
          if (workerEnv.NVD_API_KEY !== undefined || workerEnv.THREATFOX_AUTH_KEY !== undefined || workerEnv.MALWAREBAZAAR_AUTH_KEY !== undefined) {
            throw new Error('provider credentials must be file-backed in production Compose');
          }
          NODE
          mkdir -p /tmp/node8-wrapper-test
          printf '%s\n' 'postgres://ci:ci@postgres:5432/ci' > /tmp/node8-wrapper-test/database_url
          env -u DATABASE_URL DATABASE_URL_FILE=/tmp/node8-wrapper-test/database_url sh scripts/runtime-with-secrets.sh sh -c 'test "$DATABASE_URL" = "postgres://ci:ci@postgres:5432/ci"'
          docker run --rm \
            -e NODE_HOSTNAME=node.example.com \
            -e ACME_EMAIL=ops@example.com \
            -v "$PWD/deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build
        run: npm run build
      - name: Build container including pinned MRT decoder
        run: docker build -t baykush-intelligence-node:ci .
