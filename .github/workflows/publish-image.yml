name: Publish NODE image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: node-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact commit image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cenkcti/baykush-intel-node:${{ github.sha }}
            ghcr.io/cenkcti/baykush-intel-node:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record release identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const evidence = {
            schemaVersion: 'NODE8_IMAGE_RELEASE_V1',
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            image: 'ghcr.io/cenkcti/baykush-intel-node',
            digest: process.env.IMAGE_DIGEST,
            immutableRef: `ghcr.io/cenkcti/baykush-intel-node@${process.env.IMAGE_DIGEST}`,
          };
          fs.writeFileSync('node8-image-release.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE
          cat node8-image-release.json

      - name: Upload release identity
        uses: actions/upload-artifact@v4
        with:
          name: node8-image-release-${{ github.sha }}
          path: node8-image-release.json
          if-no-files-found: error
          retention-days: 30
