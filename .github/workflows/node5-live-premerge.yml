name: NODE-5 live pre-merge

on:
  push:
    branches:
      - agent/node5l-source-read-api-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node5-live-premerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build candidate
        run: npm run build

      - name: Run bounded live provider smoke
        id: live-smoke
        continue-on-error: true
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://unused:unused@127.0.0.1:1/unused
        run: npx tsx scripts/node5-live-provider-smoke.ts

      - name: Diagnose bounded public feed shape on failure
        if: steps.live-smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          curl -fsS --max-filesize 8388608 https://jvndb.jvn.jp/en/rss/jvndb_new.rdf -o "$tmpdir/jvn-new.rdf"
          curl -fsS --max-filesize 8388608 https://jvndb.jvn.jp/en/rss/jvndb.rdf -o "$tmpdir/jvn-updated.rdf"
          echo "JVN_NEW_ITEM_COUNT=$(grep -Eo '<item([[:space:]>])' "$tmpdir/jvn-new.rdf" | wc -l | tr -d ' ')"
          echo "JVN_UPDATED_ITEM_COUNT=$(grep -Eo '<item([[:space:]>])' "$tmpdir/jvn-updated.rdf" | wc -l | tr -d ' ')"

          curl -fsS --max-filesize 4194304 https://cert.europa.eu/publications/security-advisories-rss -o "$tmpdir/cert-eu.xml"
          echo "CERT_EU_DATE_SAMPLES_BEGIN"
          grep -Eo '<(pubDate|dc:date)>[^<]+' "$tmpdir/cert-eu.xml" | head -n 5 || true
          echo "CERT_EU_DATE_SAMPLES_END"

      - name: Enforce live smoke result
        if: always()
        run: |
          test "${{ steps.live-smoke.outcome }}" = "success"
