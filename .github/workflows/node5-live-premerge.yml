name: NODE-5 live pre-merge

on:
  push:
    branches:
      - agent/node5l-source-read-api-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node5-live-premerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build candidate
        run: npm run build

      - name: Run bounded live provider smoke
        env:
          NODE_ENV: test
        run: npx tsx scripts/node5-live-provider-smoke.ts
